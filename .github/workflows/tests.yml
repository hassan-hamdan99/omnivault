name: Testes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
        # macOS: uma versão só (máquinas macOS do GitHub são escassas e a fila cancelava jobs;
        # o código é o mesmo, as outras versões já são cobertas no Linux/Windows)
        exclude:
          - os: macos-latest
            python: "3.11"
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            requirements-dev.txt

      - name: 7-Zip (CBR/CB7)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full
          elif [ "$RUNNER_OS" = "macOS" ]; then brew install sevenzip
          else echo "Windows: 7-Zip já vem no runner"; fi

      - name: Dependências
        run: pip install -r backend/requirements.txt -r requirements-dev.txt

      - name: Testes (pytest)
        run: pytest tests -q

      - name: Servidor sobe e responde (run.sh no Linux/macOS)
        shell: bash
        env:
          NO_BROWSER: "1"
          PORT: "8000"
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            (cd backend && python main.py > ../server.log 2>&1 &)
          else
            chmod +x run.sh && (./run.sh > server.log 2>&1 &)
          fi
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/api/profiles > /dev/null && break
            sleep 1
          done
          page=$(curl -sf http://127.0.0.1:8000/)
          grep -q "Omnivault" <<< "$page"
          profs=$(curl -sf http://127.0.0.1:8000/api/profiles)
          grep -q '"Leitor"' <<< "$profs"
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST -H "Origin: http://site-externo.example" http://127.0.0.1:8000/api/shutdown)
          test "$code" = "403"
          echo "OK: servidor no ar, perfil inicial criado, origem externa bloqueada"

      - name: Log do servidor
        if: always()
        shell: bash
        run: cat server.log 2>/dev/null || true
